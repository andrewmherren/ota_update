; PlatformIO Project Configuration File for OTA Update Module
;
; This module provides over-the-air firmware update capabilities with:
;   - Semantic versioning and update policies
;   - Multiple authentication modes (PUBLIC, SHARED_KEY, DEVICE_SPECIFIC)
;   - SHA256 verification and HTTPS support
;   - Web interface and REST API
;
; Test environments:
;   - test_native: Fast, local C++ tests with mocked Arduino APIs (default)
;   - test_esp32:  On-device ESP32 compilation and integration tests
;
; Visit https://docs.platformio.org/page/projectconf.html for more options

; ============================================================================
; PLATFORMIO SETTINGS
; ============================================================================
[platformio]
default_envs = test_native

; ============================================================================
; SHARED TEST CONFIGURATION
; ============================================================================
[test_base]
test_framework = unity
lib_ldf_mode = deep+
test_build_src = yes
build_unflags = -std=gnu++11
build_flags = 
	-std=gnu++17
	-DUNITY_INCLUDE_CONFIG_H
	-DSTANDALONE_TESTS
	; OTA module configuration (required)
	-DOTA_FIRMWARE_VERSION='"1.0.0-test"'
	-DOTA_MANIFEST_URL='"https://example.com/manifest.json"'
	-DOTA_AUTH_MODE=PUBLIC_ACCESS
extra_scripts = scripts/inject_version_define.py
lib_deps = 
	bblanchon/ArduinoJson@^6.21.0
    https://github.com/andrewmherren/web_platform_interface.git#cpp_arduino

; ============================================================================
; NATIVE TEST ENVIRONMENT (Default)
; ============================================================================
; Runs OTA module tests locally with ArduinoFake mocks for fast iteration.
; Tests cover:
;   - Version parsing and comparison (VersionManager)
;   - Manifest parsing and validation (OTACore)
;   - Version selection and update policies
;   - Module lifecycle and route registration
;
; Includes code coverage analysis via gcov.
;
; Run with: pio test -e test_native
; ============================================================================
[env:test_native]
extends = test_base
platform = native
test_filter = *
build_src_filter =
    +<../test/native/src/**>
    +<core/*>
test_build_src = yes
build_flags =
    ${test_base.build_flags}
    -DNATIVE_PLATFORM
	; Debug symbols and no optimization for coverage accuracy
    -g
    -O0
	; Code coverage flags
    --coverage
    -fprofile-arcs
    -ftest-coverage
    -lgcov
	; Disable inlining for better coverage accuracy
    -fno-inline
    -fno-inline-small-functions
    -fno-default-inline
	; Enable ArduinoFake subsystems
    -DARDUINOFAKE_ENABLE_WIFI
    -DARDUINOFAKE_ENABLE_SERIAL
    -DARDUINOFAKE_ENABLE_STRING
    -DARDUINOFAKE_ENABLE_WIRE
	; Enable debug logging
    -DDEBUG_PRINTF=printf
    '-DDEBUG_PRINTLN(x)=printf("%%s\\n", x)'
lib_deps =
    ${test_base.lib_deps}
    https://github.com/FabioBatSilva/ArduinoFake.git
    Unity
check_tool = cppcheck
check_flags = cppcheck: --enable=all --std=c++17

; ============================================================================
; ESP32 HARDWARE TEST ENVIRONMENT
; ============================================================================
; Runs OTA module tests on actual ESP32-S3 hardware.
; Tests verify:
;   - Module initialization and configuration
;   - Route registration
;   - Integration with web_platform
;   - HTTP client and OTA Update.h APIs
;
; Uses the built-in Unity test framework from ESP-IDF (not external Unity lib).
;
; Run with: pio test -e test_esp32
; Note: Update COM port below to match your device
; ============================================================================
[env:test_esp32]
extends = test_base
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
test_filter = *
build_flags = 
	${test_base.build_flags}
	-DESP_PLATFORM
	-DARDUINO_USB_MODE=1
	; Enable debug logging
	-DCORE_DEBUG_LEVEL=4
build_src_filter = 
	+<*>
	+<../test/esp32/**/*.cpp>
; Use ESP-IDF's built-in Unity, not external Unity library
lib_ignore = Unity
lib_deps =
    ${test_base.lib_deps}
    https://github.com/andrewmherren/web_platform.git#cpp_arduino
; Serial communication settings
monitor_speed = 115200
upload_speed = 460800